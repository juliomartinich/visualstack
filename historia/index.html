<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Stack de Demanda de Camiones - Nueva App</title>
  
  <!-- D3.js -->
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <!-- Alpine.js -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  
  <!-- CSS (importa versiondesa) -->
  <link rel="stylesheet" href="styles.css">
</head>
<body x-data="appState">
  <div id="app-layout">
    <div id="chart-container" style="position: relative; border-bottom: 2px solid #eee; width: 1260px;">
      
      <!-- Fila de Controles Superior (Idéntica a versiondesa) -->
      <div id="header-date-container"
        style="display: flex; justify-content: space-between; align-items: center; width: 1260px; padding-left: 50px; padding-right: 20px; box-sizing: border-box; height: 35px; font-family: sans-serif; font-size: 11px;">
        
        <div style="display: flex; align-items: center; gap: 10px;">
          <!-- Combo 2: Día (Pedidos o Despachos) -->
          <div style="display: flex; align-items: center; gap: 4px;">
            <select x-model="selectedPedidosDate" @change="cambiarDia()"
              style="font-size: 11px; padding: 1px 3px; border-radius: 4px; border: 1px solid #ccc; cursor: pointer; background: white;">
              <option value="">Seleccionar Día...</option>
              <template x-for="date in (activeMode === 'pedidos' ? orderDates : ticketDates)" :key="date">
                <option :value="date" x-text="'Día: ' + formatToDddDdMmm(date)"></option>
              </template>
            </select>
          </div>


          <!-- Combo 3: Modo -->
          <div style="display: flex; align-items: center; gap: 4px; border-left: 1px solid #ddd; padding-left: 10px;">
            <select x-model="activeMode" @change="cambiarModo()"
              style="font-size: 11px; padding: 1px 3px; border-radius: 4px; border: 1px solid #ccc; cursor: pointer;"
              :style="activeMode === 'pedidos' ? 'border-color: #0066cc; background-color: #e1f5fe;' : 'border-color: #2e7d32; background-color: #e8f5e9;'">
              <option value="pedidos">Modo: Pedidos</option>
              <option value="tickets">Modo: Despachos</option>
            </select>
          </div>

          <!-- Combo 4: Planta -->
          <div style="display: flex; align-items: center; gap: 4px; border-left: 1px solid #ddd; padding-left: 10px;">
            <label style="font-weight: 600; color: #555;">Planta:</label>
            <select x-model="selectedPlanta" @change="filtrarYRedibujar()"
              style="font-size: 11px; padding: 1px 3px; border-radius: 4px; border: 1px solid #ccc; cursor: pointer; background: white;">
              <template x-for="p in plantasOptions" :key="p.id">
                <option :value="p.id" x-text="p.label"></option>
              </template>
            </select>
          </div>
        </div>

        <!-- Volúmenes y Modo (Derecha) -->
        <div style="font-size: 11px; color: #333; font-weight: 600; font-family: sans-serif;">
          Volumen: <span x-text="`${metrics.volumenT} m3`"></span>
          <span style="font-size: 10px; color: #555; font-weight: normal;"
            x-text="`, Confirmado: ${metrics.volConfirmado} m3`"></span>
          <span class="badge" :class="activeMode" x-text="activeMode === 'pedidos' ? 'Pedidos' : 'Despachos'"
            style="font-size: 9px; font-weight: bold; padding: 1px 5px; border-radius: 3px; margin-left: 8px; text-transform: uppercase;"></span>
        </div>

      </div>

      <!-- Spinner de Carga -->
      <div x-show="loading" style="display: flex; justify-content: center; align-items: center; height: 350px; font-family: sans-serif; font-size: 13px; color: #666;">
        Cargando datos...
      </div>

      <!-- Contenedor de Gráficos (4 versiones comparadas) -->
      <!-- Contenedor del Gráfico Único Superpuesto -->
      <div x-show="!loading" style="width: 1260px; position: relative; background: white; padding: 15px 0; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box;">
        <!-- Leyenda de las Curvas -->
        <div style="display: flex; gap: 20px; font-family: sans-serif; font-size: 11px; padding-left: 50px; margin-bottom: 15px;">
          <template x-for="(suffix, index) in activeSuffixes" :key="suffix">
            <div style="display: flex; align-items: center; gap: 6px;">
              <!-- Línea de muestra de leyenda estilizada por JS -->
              <span :style="getLegendLineStyle(index)"></span>
              <span style="font-weight: bold; color: #333;" x-text="formatToDddDdMmm(suffix)"></span>
              <span style="color: #666;" x-text="index === 0 ? '(Mismo día)' : `(-${index} día/s)`"></span>
              <span x-show="!hasDataForSuffix(suffix)" style="color: #ef4444; font-size: 10px; font-weight: normal;">(No disp.)</span>
            </div>
          </template>
        </div>
        
        <div id="chart-container-global" style="position: relative; width: 1260px; height: 450px;">
          <svg id="chart-global" width="1260" height="450"></svg>
        </div>
        
        <!-- Tooltip flotante -->
        <div id="chart-tooltip" class="tooltip" style="display: none;"></div>
      </div>

    </div>
  </div>

  <!-- CONFIG Y CORE REUTILIZADO (Rutas relativas a la carpeta raíz) -->
  <script src="../js/config.js"></script>
  <script src="../js/dataUtils.js"></script>
  <script src="../js/stackUtils.js"></script>

  <!-- LÓGICA DE LA NUEVA APP -->
  <script src="js/main.js"></script>
  <script src="js/chart.js"></script>
</body>
</html>
